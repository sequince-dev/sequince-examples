name: Publish PR documentation
on:
  workflow_run:
    workflows: [Example documentation]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  publish:
    if: >-
      github.repository == 'sequince-dev/sequince-examples' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    concurrency:
      group: examples-rtd-pr-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      # workflow_run checks out trusted default-branch code, never PR code.
      # Treat the downloaded artifacts as data and never execute their files.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate artifacts and prepare PR preview
        id: preview
        run: python3 scripts/publish_pr_docs.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Upload PR preview to Read the Docs
        if: steps.preview.outputs.ready == 'true'
        # Same pinned beta revision as the main documentation workflow.
        uses: readthedocs/upload-action@f1f5bac5fc97073927100367d8a5bb22587e1e16
        with:
          token: ${{ secrets.READTHEDOCS_TOKEN }}
          project-slug: ${{ vars.RTD_PROJECT }}
          html: ${{ steps.preview.outputs.html }}
          # workflow_run metadata describes the default branch, so override it
          # with the validated PR metadata rather than relying on inference.
          version-name: ${{ steps.preview.outputs.version }}
          version-type: external
          commit: ${{ steps.preview.outputs.commit }}
