version: 2
build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    pre_build:
      - python scripts/docs_pipeline.py fetch
    post_build:
      - python scripts/docs_pipeline.py check-latest
python:
  install:
    - requirements: docs/requirements.txt
sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
