[tool.ruff]
line-length = 79
indent-width = 4
target-version = "py39"

[tool.ruff.lint]
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
extend-select = ["I"]

[tool.pixi.workspace]
name = "sequince-examples"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]
requires-pixi = ">=0.81.0"

[tool.pixi.dependencies]
python = "3.13.*"

[tool.pixi.feature.cpu.pypi-dependencies]
sequince = { version = "*", extras = ["corner", "hdf5"] }

[tool.pixi.feature.jax.pypi-dependencies]
jax = ">0.5.3"

[tool.pixi.feature.jax.activation.env]
JAX_PLATFORMS = "cpu"

[tool.pixi.feature.flow.dependencies]
pytorch-cpu = "*"

[tool.pixi.feature.flow.pypi-dependencies]
sequince-density = { version = "*", extras = ["zuko"] }

[tool.pixi.feature.docs.dependencies]
sphinx = "8.2.*"
sphinx-book-theme = "1.1.*"

[tool.pixi.feature.check.dependencies]
ruff = "0.14.*"
pre-commit = "*"
pytest = "*"

[tool.pixi.environments]
default = { features = ["cpu"], solve-group = "cpu" }
jax = { features = ["cpu", "jax"], solve-group = "cpu" }
flow = ["cpu", "flow"]
docs = ["docs"]
check = ["check"]

[tool.pixi.tasks]
example = "python scripts/docs_pipeline.py run"
examples = "python scripts/docs_pipeline.py run-all"
validate-outputs = "python scripts/docs_pipeline.py validate"
prepare-docs = "python scripts/docs_pipeline.py prepare"
bundle = "python scripts/docs_pipeline.py bundle"

[tool.pixi.feature.docs.tasks]
docs = { cmd = "sphinx-build -W --keep-going -b html docs docs/_build/html", depends-on = ["prepare-docs"] }

[tool.pixi.feature.check.tasks]
test = "pytest tests"
lint = "ruff check scripts tests docs/conf.py"
format-check = "ruff format --check scripts tests docs/conf.py"
